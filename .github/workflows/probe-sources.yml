name: Probe job sources

# 수집처 후보 점검(일회성). 데이터 파일을 커밋하지 않고 결과를 실행 요약에만 남긴다.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["scripts/probe-sources.mjs", "scripts/fetch-companies.mjs", "scripts/fetch-radar.mjs", ".github/workflows/probe-sources.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 수집 스크립트를 고쳤을 때 main에 합치기 전에 실제로 도는지만 확인한다(결과 파일은 커밋하지 않음)
      # 수집처 후보 점검 — 결과는 실행 요약(Summary)과 로그에 남는다
      - run: node scripts/probe-sources.mjs
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node scripts/fetch-radar.mjs
        continue-on-error: true
