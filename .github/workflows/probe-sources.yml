name: Probe job sources

# 수집처 후보 점검(일회성). 데이터 파일을 커밋하지 않고 결과를 실행 요약에만 남긴다.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["scripts/build-predictions.mjs", "scripts/probe-sources.mjs", "scripts/fetch-companies.mjs", "scripts/build-gongchae.mjs", "scripts/fetch-radar.mjs", ".github/workflows/probe-sources.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 수집 스크립트를 고쳤을 때 main에 합치기 전에 실제로 도는지만 확인한다(결과 파일은 커밋하지 않음)
      # 텐센트(Workday, 서울 근무지 필터)와 자소설닷컴 교육과정 거르기가 실제로 되는지(결과는 커밋하지 않음)
      - run: |
          curl -s -X POST -H 'Content-Type: application/json' -d '{"appliedFacets":{"locations":["b3d4dad114e4100177c233d159a40000"]},"limit":20,"offset":0,"searchText":""}' https://tencent.wd1.myworkdayjobs.com/wday/cxs/tencent/Tencent_Careers/jobs | head -c 3000; echo
          ONLY=텐센트 node scripts/fetch-companies.mjs
      - run: node scripts/fetch-jobs.mjs && git diff --stat data/jobs.json
