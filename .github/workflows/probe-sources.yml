name: Probe job sources

# 수집처 후보 점검(일회성). 데이터 파일을 커밋하지 않고 결과를 실행 요약에만 남긴다.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["scripts/build-predictions.mjs", "scripts/probe-sources.mjs", "scripts/fetch-companies.mjs", "scripts/build-gongchae.mjs", "scripts/fetch-radar.mjs", "scripts/lib/jd-text.mjs", ".github/workflows/probe-sources.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 수집 스크립트를 고쳤을 때 main에 합치기 전에 실제로 도는지만 확인한다(결과 파일은 커밋하지 않음)
      # 넷플릭스 공고 본문에서 연차 문장이 어떻게 적혀 있는지(연차를 못 읽은 공고)
      - run: |
          for id in 790318793899 790318350853 790317631095; do
            echo "=== $id"
            curl -s "https://explore.jobs.netflix.net/api/apply/v2/jobs/$id?domain=netflix.com" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);const t=(j.job_description||"");console.log("len",t.length);for(const m of t.matchAll(/.{0,80}(year|yrs|experience|경력).{0,80}/gi))console.log(JSON.stringify(m[0]))})'
          done
