name: Probe job sources

# 수집처 후보 점검(일회성). 데이터 파일을 커밋하지 않고 결과를 실행 요약에만 남긴다.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["scripts/probe-sources.mjs", ".github/workflows/probe-sources.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/probe-sources.mjs
