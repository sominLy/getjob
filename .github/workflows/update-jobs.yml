name: Update job listings

on:
  schedule:
    - cron: "0 2 * * *" # 매일 KST 11:00 (UTC 02:00)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npx playwright install --with-deps chromium

      - run: node scripts/fetch-jobs.mjs
      - run: node scripts/fetch-ai-companies.mjs
      # 주니어 기획·마케팅 공고판 아티팩트용 수집 (ai-companies-jobs.json을 재사용하므로 그 뒤에 실행).
      # Claude 클라우드 환경은 채용 사이트 접근이 막혀 있어서 수집은 여기서 하고, 루틴은 빌드·발행만 한다.
      - run: python3 artifact/collect.py
      # 채용 레이더 탭(data/radar.json). 토스·구글은 페이지 구조가 바뀌면 깨질 수 있어서,
      # 실패해도 나머지 수집·배포는 계속 진행한다(스크립트가 실패한 회사는 직전 결과를 유지).
      - run: node scripts/fetch-radar.mjs
        continue-on-error: true
      - run: node scripts/fetch-official-details.mjs
      - run: node scripts/fetch-tracks.mjs
      - run: node scripts/archive-expired.mjs
      # 스타트업·유니콘·외국계 공식 채용 시스템(그리팅·Greenhouse·Ashby·Workday 등)의 기획·PM·마케팅 공고
      - run: node scripts/fetch-companies.mjs
        continue-on-error: true
      # 매칭 아카이브용 JD 키워드(지원보드·레이더·주니어 공고판 본문). 위 수집 결과를 모두 쓰므로 맨 뒤에 둔다.
      - run: node scripts/build-jd-keywords.mjs
        continue-on-error: true

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json data/archive.json data/ai-companies-jobs.json data/details.json data/radar.json data/company-jobs.json data/jd-keywords.json data/keyword-dict.json artifact/data.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "공고 자동 업데이트 $(date -u +%F)"
            git push
          fi

      # Vercel이 GitHub push로 자동 배포되지 않아서(2026-09-17 확인) 여기서 직접 배포한다.
      # 필요 시크릿: repo Settings > Secrets and variables > Actions에 VERCEL_TOKEN 등록
      # (https://vercel.com/account/tokens 에서 발급, "getjob" 프로젝트로 스코프 권장)
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_eivQnLHnOtYTptIEcwW3VzGS
          VERCEL_PROJECT_ID: prj_GNttMFJpWZKx8kKHJOhBVXYWv03p
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN secret이 없어서 배포를 건너뜁니다. (Settings > Secrets and variables > Actions에 등록)"
            exit 0
          fi
          npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel build --prod --token="$VERCEL_TOKEN"
          DEPLOY_URL=$(npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          npx vercel alias set "$DEPLOY_URL" getjob.vercel.app --token="$VERCEL_TOKEN"
