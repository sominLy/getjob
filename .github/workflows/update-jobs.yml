name: Update job listings

on:
  schedule:
    - cron: "0 2 * * *" # 매일 KST 11:00 (UTC 02:00)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npx playwright install --with-deps chromium

      - run: node scripts/fetch-jobs.mjs
      - run: node scripts/fetch-ai-companies.mjs
      - run: node scripts/fetch-official-details.mjs
      - run: node scripts/fetch-tracks.mjs
      - run: node scripts/archive-expired.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json data/archive.json data/ai-companies-jobs.json data/details.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "공고 자동 업데이트 $(date -u +%F)"
            git push
          fi
